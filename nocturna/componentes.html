<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kit de componentes v0.1 de Rueda Nocturna: botones, card, alertas e inputs.">
  <title>Kit de componentes v0.1 | Rueda Nocturna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link href="src/output.css" rel="stylesheet">
</head>
<body class="bg-crema font-cuerpo text-azul-noche dark:bg-azul-noche dark:text-crema">
<main class="mx-auto max-w-3xl space-y-10 px-4 py-10">
  <h1 class="font-titulo text-3xl font-bold">Kit de componentes v0.1</h1>
  <section class="space-y-3" aria-labelledby="botones">
    <h2 id="botones" class="font-titulo text-xl font-bold">Botones</h2>
    <div class="flex flex-wrap gap-3">
      <button type="button" class="btn-nocturna-primario">Primario</button>
      <button type="button" class="btn-nocturna-secundario">Secundario</button>
      <button type="button" class="btn-nocturna-contorno">Contorno</button>
    </div>
  </section>
  <section class="space-y-3" aria-labelledby="card">
    <h2 id="card" class="font-titulo text-xl font-bold">Card de ruta</h2>
    <article class="max-w-sm rounded-xl border border-gris-asfalto/40 bg-white p-5 shadow transition hover:shadow-lg dark:bg-azul-noche dark:border-crema/40">
      <span class="rounded-full bg-verde-ruta px-3 py-1 text-xs font-semibold text-white">Fácil</span>
      <h3 class="mt-3 font-titulo text-lg font-bold">Luces del Centro</h3>
      <p class="text-gris-asfalto dark:text-crema">10 km · 2 h</p>
      <p class="mt-2 font-bold">$55.000</p>
    </article>
  </section>
  <section class="space-y-3" aria-labelledby="alertas">
    <h2 id="alertas" class="font-titulo text-xl font-bold">Alertas</h2>
    <p role="status" class="rounded-lg bg-verde-ruta p-3 text-white">Éxito: tu inscripción fue recibida.</p>
    <p role="status" class="rounded-lg bg-amarillo-farol p-3 text-azul-noche">Aviso: quedan pocos cupos.</p>
    <p role="status" class="rounded-lg border-2 border-azul-noche bg-white p-3 text-azul-noche dark:border-amarillo-farol dark:bg-azul-noche dark:text-crema">Info: la salida es a las 7:00 p. m.</p>
  </section>
  <section class="space-y-3" aria-labelledby="inputs">
    <h2 id="inputs" class="font-titulo text-xl font-bold">Inputs</h2>
    <div>
      <label for="n" class="block font-semibold">Nombre completo</label>
      <input id="n" type="text" class="mt-1 w-full rounded-lg border-2 border-gris-asfalto bg-white p-2 text-azul-noche focus:outline-none focus:ring-4 focus:ring-naranja-pedal">
    </div>
    <div>
      <label for="c" class="block font-semibold">Correo</label>
      <input id="c" type="email" class="mt-1 w-full rounded-lg border-2 border-gris-asfalto bg-white p-2 text-azul-noche focus:outline-none focus:ring-4 focus:ring-naranja-pedal">
    </div>
  </section>
</main>
</body>
</html>
